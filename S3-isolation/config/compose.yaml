# REGRESSION FIXTURE - DO NOT DEPLOY. Original playbook topology (internal: true only). It MUST keep reproducing
# the S3-T3 failure; it is run only by harness/regression.sh with mode regression-fixture (AM11 gate bypassed on purpose).
# S3 cell-isolation spike topology (spike harness, not product code)
# Images are pinned by digest via .env (NETSHOOT_IMAGE, PY_IMAGE).
name: s3iso

x-netshoot: &netshoot
  image: ${NETSHOOT_IMAGE}
  command: ["sleep", "infinity"]

networks:
  cellnet_a:
    internal: true
  cellnet_b:
    internal: true
  edge: {}

services:
  # intended path from the cell: gateway is the only peer reachable on cellnet_*
  gateway:
    image: ${PY_IMAGE}
    command: ["sh", "-c", "mkdir -p /srv && echo gateway-ok > /srv/echo && cd /srv && exec python -m http.server 8080"]
    networks: [cellnet_a, cellnet_b, edge]

  # cell A: sidecar holds a dummy secret, listens on loopback only
  sidecar_a:
    <<: *netshoot
    command: ["sh", "-c", "mkdir -p /secrets && echo DUMMY-CELL-KEY-A-91c2 > /secrets/cell.key && exec socat TCP-LISTEN:8081,bind=127.0.0.1,fork,reuseaddr SYSTEM:'echo sidecar_a_loopback'"]
    networks: [cellnet_a]

  agent_a:
    <<: *netshoot
    network_mode: "service:sidecar_a"
    cap_drop: [ALL]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    depends_on: [sidecar_a]

  # informational: another listener on the SAME internal net (models gateway-side peers)
  neighbour_a2:
    <<: *netshoot
    command: ["sh", "-c", "exec socat TCP-LISTEN:9000,fork,reuseaddr SYSTEM:'echo neighbour_a2_open'"]
    networks: [cellnet_a]

  # cell B: sidecar listens on 0.0.0.0 so a cross-cell probe is meaningful
  sidecar_b:
    <<: *netshoot
    command: ["sh", "-c", "exec socat TCP-LISTEN:8081,fork,reuseaddr SYSTEM:'echo sidecar_b_open'"]
    networks: [cellnet_b]

  agent_b:
    <<: *netshoot
    network_mode: "service:sidecar_b"
    cap_drop: [ALL]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    depends_on: [sidecar_b]

  # positive-control container with normal egress
  outside:
    <<: *netshoot
    networks: [edge]

  # safe local stand-in for a metadata service (fake data only)
  mdfixture:
    image: ${PY_IMAGE}
    command: ["sh", "-c", "mkdir -p /srv/latest/meta-data && echo FAKE-NOT-A-SECRET > /srv/latest/meta-data/token && cd /srv && exec python -m http.server 80"]
    networks: [edge]

  # positive control for capability tests (same internal net, NET_ADMIN/NET_RAW granted)
  privctl_a:
    <<: *netshoot
    cap_add: [NET_ADMIN, NET_RAW]
    networks: [cellnet_a]
