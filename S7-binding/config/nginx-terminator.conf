# TLS terminator in front of the PEP (AM2). Requires a client certificate from the test CA and
# forwards the VERIFIED certificate to the PEP, replacing any client-supplied X-Client-Cert.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr info;
events {}
http {
  log_format s7 '$remote_addr "$request" $status verify=$ssl_client_verify cn="$ssl_client_s_dn"';
  access_log /dev/stdout s7;
  client_body_temp_path /tmp/cb; proxy_temp_path /tmp/pt; fastcgi_temp_path /tmp/ft; uwsgi_temp_path /tmp/ut; scgi_temp_path /tmp/st;
  server {
    listen 8443 ssl;
    ssl_certificate /secrets/server.crt;
    ssl_certificate_key /secrets/server.key;
    ssl_client_certificate /secrets/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 1;
    location / {
      proxy_pass http://pep:8000;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host pep;
      proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 300s;
    }
  }
}
