# Cell sidecar (AM2). Listens on loopback only; the agent shares this network namespace.
# Holds the cell certificate/key and the session JWT (in /secrets, which the agent cannot see).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr info;
events {}
http {
  log_format s7 '$remote_addr "$request" $status up=$upstream_status ssl_verify_upstream';
  access_log /dev/stdout s7;
  client_body_temp_path /tmp/cb; proxy_temp_path /tmp/pt; fastcgi_temp_path /tmp/ft; uwsgi_temp_path /tmp/ut; scgi_temp_path /tmp/st;
  server {
    listen 127.0.0.1:8081;
    location / {
      proxy_pass https://terminator:8443;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host terminator;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 300s;
      proxy_ssl_certificate /secrets/cell.crt;
      proxy_ssl_certificate_key /secrets/cell.key;
      proxy_ssl_trusted_certificate /secrets/ca.crt;
      proxy_ssl_verify on;
      proxy_ssl_name terminator;
      proxy_ssl_server_name on;
      include /secrets/auth.conf;   # proxy_set_header Authorization "Bearer <cell JWT>"; replaces any agent-supplied value
    }
  }
}
