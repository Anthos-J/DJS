name: s5egress
services:
  allowed-srv:
    command:
      - python
      - /harness/srv.py
    environment:
      SRV_NAME: allowed-srv
    image: mandate-mitm:wave3
    labels:
      mandate.role: test-fixture
    networks:
      edge: null
    volumes:
      - type: bind
        source: C:\Users\SEBIN\Desktop\DJ SANGHVI\validation\S5-egress\harness
        target: /harness
        read_only: true
        bind: {}
      - type: volume
        source: srv_log
        target: /log
        volume: {}
  cellside:
    command:
      - sleep
      - infinity
    image: nicolaka/netshoot@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70
    labels:
      mandate.cell: s
      mandate.role: cell-netns-owner
    networks:
      cellnet_s: null
  denied-srv:
    command:
      - python
      - /harness/srv.py
    environment:
      SRV_NAME: denied-srv
    image: mandate-mitm:wave3
    labels:
      mandate.role: test-fixture
    networks:
      edge: null
    volumes:
      - type: bind
        source: C:\Users\SEBIN\Desktop\DJ SANGHVI\validation\S5-egress\harness
        target: /harness
        read_only: true
        bind: {}
      - type: volume
        source: srv_log
        target: /log
        volume: {}
  egress:
    command:
      - mitmdump
      - --mode
      - regular
      - --listen-port
      - "8080"
      - -s
      - /harness/egress_addon.py
      - --set
      - connection_strategy=lazy
      - --set
      - upstream_cert=false
      - --set
      - ignore_hosts=.*
      - --set
      - block_global=false
    environment:
      BYTE_BUDGET: "3000000"
    image: mandate-mitm:wave3
    labels:
      mandate.role: gateway
    networks:
      cellnet_s: null
      edge: null
    volumes:
      - type: bind
        source: C:\Users\SEBIN\Desktop\DJ SANGHVI\validation\S5-egress\harness
        target: /harness
        read_only: true
        bind: {}
      - type: volume
        source: egress_log
        target: /log
        volume: {}
    depends_on:
      allowed-srv:
        condition: service_started
        required: true
      denied-srv:
        condition: service_started
        required: true
  outside:
    command:
      - sleep
      - infinity
    image: mandate-mitm:wave3
    labels:
      mandate.role: test-fixture
    networks:
      edge: null
    volumes:
      - type: bind
        source: C:\Users\SEBIN\Desktop\DJ SANGHVI\validation\S5-egress\harness
        target: /harness
        read_only: true
        bind: {}
  sandbox:
    cap_drop:
      - ALL
    command:
      - sleep
      - infinity
    environment:
      HTTP_PROXY: http://sess-1:tok-good-1@egress:8080
      HTTPS_PROXY: http://sess-1:tok-good-1@egress:8080
    image: mandate-mitm:wave3
    labels:
      mandate.cell: s
      mandate.role: agent
    network_mode: service:cellside
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: C:\Users\SEBIN\Desktop\DJ SANGHVI\validation\S5-egress\harness
        target: /harness
        read_only: true
        bind: {}
    depends_on:
      cellside:
        condition: service_started
        required: true
networks:
  cellnet_s:
    name: s5egress_cellnet_s
    driver: bridge
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
    internal: true
    labels:
      mandate.cell: s
      mandate.role: execution-cell
    enable_ipv6: false
  edge:
    name: s5egress_edge
    internal: true
volumes:
  egress_log:
    name: s5egress_egress_log
  srv_log:
    name: s5egress_srv_log
x-mandate-cell-network:
  driver: bridge
  driver_opts:
    com.docker.network.bridge.gateway_mode_ipv4: isolated
    com.docker.network.bridge.gateway_mode_ipv6: isolated
  enable_ipv6: false
  internal: true
